# KBS_STAGER Table 6, WADI / OCSVM.
# Original seeds were not recorded. The five values below are replay seeds.
run:
  baseline: ocsvm
  dataset: wadi
  seeds: [0, 1, 2, 3, 4]
model: ocsvm
model_params:
  nu: 0.1
  kernel: rbf
  gamma: 1.0e-05
  contamination: 1.0e-05
preprocessing:
  normalization: train_minmax
  ewm_alpha: 0.8
  window_size: 1
evaluation:
  protocol: evaluate_ensemble_best_modified
  fpr: 0.002
  label_aware: true
  require_etapr: true
