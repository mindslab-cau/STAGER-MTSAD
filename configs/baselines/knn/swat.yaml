# KBS_STAGER Table 6, SWaT / KNN.
# Original seeds were not recorded. The five values below are replay seeds.
run:
  baseline: knn
  dataset: swat
  seeds: [0, 1, 2, 3, 4]
model: knn
model_params:
  n_neighbors: 5
  method: largest
  contamination: 0.001
  n_jobs: null
preprocessing:
  normalization: train_minmax
  ewm_alpha: 0.8
  window_size: 1
evaluation:
  protocol: evaluate_ensemble_best_modified
  fpr: 0.002
  label_aware: true
  require_etapr: true
