# KBS_STAGER Table 6, SWaT / USAD.
run:
  baseline: usad
  dataset: swat
  seeds: [3809632705, 2367899585, 1927285282, 1901393921, 2995911408]
dataset:
  logical_id: swat
  data_included: false
model:
  num_channels: 51
  window_size: 12
  latent_dim: 40
data:
  window_size: 12
  stride: 1
preprocessing:
  normalize: true
  ewm_alpha: 0.8
score:
  definition: legacy_decoder1_window_mse
training:
  batch_size: 32
  learning_rate: 0.0001
  optimizer: AdamW
  num_epochs: 50
  warmup_epochs: 5
  validation_warmup_epochs: 10
  learning_rate_ratio_after_warmup: 0.5
  patience: 10
  delta_threshold: 0.0001
  validation_fraction: 0.2
  best_state_policy: deep_delta_snapshot
evaluation:
  fpr: 0.002
