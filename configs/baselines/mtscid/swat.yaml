# KBS_STAGER Table 6, SWaT / MtsCID.
# Original seeds were not recorded. The five values below are replay seeds.
run:
  baseline: mtscid
  dataset: swat
  seeds: [0, 1, 2, 3, 4]
baseline: mtscid
data:
  window_size: 100
  stride: 1
  continuity: legacy_endpoint
  test_stride: 100
preprocessing:
  missing_values: [interpolate, backward_fill, forward_fill, zero_fill]
  normalization: train_minmax
  clip: false
  apply_ewm: true
  ewm_alpha: 0.8
  ewm_adjust: true
model:
  d_model: 51
  temperature: 0.1
  encoder_layers: 1
  branches_group_embedding: False_False
  multiscale_kernel_size: [5]
  multiscale_patch_size: [10, 20]
  branch1_networks: [fc_linear, intra_fc_transformer, multiscale_ts_attention]
  branch1_match_dimension: first
  branch2_networks: [multiscale_conv1d, inter_fc_transformer]
  branch2_match_dimension: first
  decoder_networks: [linear]
  decoder_layers: 1
  decoder_group_embedding: 'False'
  embedding_init: normal
  memory_guided: sinusoid
  dropout: 0.3
training:
  batch_size: 32
  num_epochs: 50
  patience: 10
  learning_rate: 0.0001
  weight_decay: 5.0e-05
  validation_fraction: 0.2
  alpha: 1.0
score:
  alignment: flatten
  aggregation: normal_mean
  direction: higher_is_more_anomalous
evaluation:
  fpr: 0.002
