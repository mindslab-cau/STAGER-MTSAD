name: stager
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.11.0
  - pip=24.0
  - pytorch=2.4.0
  - pytorch-cuda=11.8
  - numpy=1.26.4
  - pandas=2.1.1
  - scipy=1.13.1
  - scikit-learn=1.3.0
  - matplotlib=3.9.1
  - pyyaml=6.0.1
  - tqdm=4.66.4
  - opencv=4.7.0
  - pyod=2.0.5
  - pip:
      - ray==2.33.0
      - faster-eTaPR==0.1.2
      - torch-geometric==2.6.1
      - einops==0.8.0
      - psutil==6.0.0
      - -e ./third_party/etapr
      - -e .
